<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Material rangka besi hollow dan permukaan HPL pada set meja kursi sekolah Zeco">
  <defs>
    <linearGradient id="f2Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F7FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="f2Sheet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F1FE"/>
    </linearGradient>
    <linearGradient id="f2Steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#f2Bg)"/>
  <circle cx="132" cy="86" r="118" fill="#DBEAFE" opacity=".45"/>
  <circle cx="546" cy="352" r="108" fill="#EFF6FF"/>

  <ellipse cx="222" cy="336" rx="168" ry="18" fill="#1E3A8A" opacity=".07"/>

  <!-- Susunan material (sheet HPL) -->
  <g>
    <rect x="92" y="252" width="262" height="26" rx="10" fill="#DBEAFE" stroke="#C7DDFB" stroke-width="2"/>
    <rect x="104" y="228" width="262" height="26" rx="10" fill="url(#f2Sheet)" stroke="#DCE7F7" stroke-width="2"/>
    <rect x="116" y="204" width="262" height="26" rx="10" fill="url(#f2Sheet)" stroke="#DCE7F7" stroke-width="2"/>
    <rect x="128" y="180" width="262" height="26" rx="10" fill="#FFFFFF" stroke="#DCE7F7" stroke-width="2"/>
    <rect x="150" y="188" width="86" height="7" rx="3.5" fill="#93C5FD"/>
  </g>

  <!-- Penampang rangka besi hollow -->
  <g>
    <rect x="404" y="140" width="152" height="152" rx="26" fill="url(#f2Steel)"/>
    <rect x="432" y="168" width="96" height="96" rx="16" fill="#FFFFFF"/>
    <rect x="432" y="168" width="96" height="96" rx="16" fill="none" stroke="#BFD7FA" stroke-width="3"/>
    <rect x="466" y="168" width="28" height="96" fill="#EFF6FF" stroke="#BFD7FA" stroke-width="3"/>
    <circle cx="480" cy="216" r="5" fill="#3B82F6"/>
  </g>

  <path d="M356 216h40" stroke="#2563EB" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
  <circle cx="358" cy="216" r="5" fill="#2563EB"/>
  <circle cx="394" cy="216" r="5" fill="#2563EB"/>
</svg>